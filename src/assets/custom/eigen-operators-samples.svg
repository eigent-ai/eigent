<svg xmlns="http://www.w3.org/2000/svg" width="960" height="850" viewBox="0 0 960 850" fill="none">
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { fill: #f5f5f5; font-size: 24px; font-weight: 600; }
      .subtitle { fill: #8f949e; font-size: 13px; }
      .section { fill: #b7bbc3; font-size: 12px; font-weight: 600; letter-spacing: .12em; }
      .label { fill: #f5f5f5; font-size: 14px; font-weight: 500; }
      .meta { fill: #7c818b; font-size: 11px; }
      .center { text-anchor: middle; }
      .card { fill: #15171c; stroke: #282b32; }
      .icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <pattern id="grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M4 0H0v4" stroke="#353942" stroke-width=".55"/>
    </pattern>
    <symbol id="grid-24" viewBox="0 0 96 96">
      <rect width="96" height="96" rx="8" fill="#111318"/>
      <rect width="96" height="96" rx="8" fill="url(#grid)"/>
      <path d="M48 0v96M0 48h96" stroke="#4a4f5a" stroke-width=".8"/>
      <rect x="4" y="4" width="88" height="88" rx="6" stroke="#666c78" stroke-width=".8" stroke-dasharray="3 3"/>
    </symbol>

    <symbol id="icon-default" viewBox="0 0 24 24"><g class="icon"><path d="M7 17 12 7M11 5l6 12"/></g></symbol>
    <symbol id="icon-code" viewBox="0 0 24 24"><g class="icon"><path d="M7 5 2 12l5 7M17 5l5 7-5 7"/><path d="m9 14 3-4 3 4" stroke-width="1.65"/></g></symbol>
    <symbol id="icon-document" viewBox="0 0 24 24"><g class="icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6" stroke-width="1.25"/><path d="m8 17 4-6 4 6" stroke-width="1.65"/></g></symbol>
    <symbol id="icon-image" viewBox="0 0 24 24"><g class="icon"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="m4 18 6-9 4 6 2-3 4 6" stroke-width="1.65"/><path d="m15 9 2-3 2 3" stroke-width="1.25"/></g></symbol>
    <symbol id="icon-bird" viewBox="0 0 24 24"><g class="icon"><path d="m3 16 5-6 4 5 4-5 5 6"/><path d="m8 10 4-4 4 4M12 15v5M9 18l3 2 3-2" stroke-width="1.25"/></g></symbol>
    <symbol id="icon-browser" viewBox="0 0 24 24"><g class="icon"><circle cx="12" cy="12" r="10"/><path d="M2 12h5M17 12h5" stroke-width="1.25"/><path d="M7 17 12 7M11 5l6 12" stroke-width="1.65"/></g></symbol>
    <symbol id="icon-nested" viewBox="0 0 24 24"><g class="icon"><path d="M3 18 12 6l9 12"/><path d="m8 18 4-5 4 5"/></g></symbol>
    <symbol id="icon-mirrored" viewBox="0 0 24 24"><g class="icon"><path d="M4 15 12 7l8 8"/><path d="m4 9 8 8 8-8"/></g></symbol>
    <symbol id="icon-stacked" viewBox="0 0 24 24"><g class="icon"><path d="m5 10 7-6 7 6"/><path d="m5 20 7-6 7 6"/></g></symbol>
    <symbol id="icon-offset" viewBox="0 0 24 24"><g class="icon"><path d="m2 17 6-8 6 8"/><path d="m10 15 6-8 6 8"/></g></symbol>
    <symbol id="icon-aperture" viewBox="0 0 24 24"><g class="icon"><path d="m8 8 4-4 4 4M16 8l4 4-4 4M16 16l-4 4-4-4M8 16l-4-4 4-4"/></g></symbol>
    <symbol id="icon-interlocked" viewBox="0 0 24 24"><g class="icon"><path d="m3 16 6-8 6 8"/><path d="m9 8 6 8 6-8"/></g></symbol>
    <symbol id="icon-crossed" viewBox="0 0 24 24"><g class="icon"><path d="M4 18 12 6l8 12"/><path d="m6 4 12 8-12 8"/></g></symbol>
    <symbol id="icon-split" viewBox="0 0 24 24"><g class="icon"><path d="M3 17 10 7M14 7l7 10"/><path d="m7 19 3-4M14 15l3 4"/></g></symbol>
    <symbol id="icon-wave" viewBox="0 0 24 24"><g class="icon"><path d="m2 14 4-6 4 6 4-6 4 6 4-6"/></g></symbol>
    <symbol id="icon-woven" viewBox="0 0 24 24"><g class="icon"><path d="m3 10 5-6 4 6 4-6 5 6"/><path d="m3 20 5-6 4 6 4-6 5 6"/></g></symbol>
  </defs>

  <rect width="960" height="850" fill="#0d0f13"/>
  <text x="40" y="42" class="title">Eigen Caret Agents — grid inspection</text>
  <text x="40" y="65" class="subtitle">Rounded Lucide geometry with one shared coordinate system and ten non-semantic pattern variants.</text>

  <g transform="translate(40 82)">
    <g><rect class="card" width="102" height="32" rx="16"/><text x="51" y="21" class="meta center">24 × 24 grid</text></g>
    <g transform="translate(112)"><rect class="card" width="112" height="32" rx="16"/><text x="56" y="21" class="meta center">1.25–2px stroke</text></g>
    <g transform="translate(234)"><rect class="card" width="112" height="32" rx="16"/><text x="56" y="21" class="meta center">≥1px padding</text></g>
    <g transform="translate(356)"><rect class="card" width="148" height="32" rx="16"/><text x="74" y="21" class="meta center">Round caps + joins</text></g>
    <g transform="translate(514)"><rect class="card" width="122" height="32" rx="16"/><text x="61" y="21" class="meta center">2px corner radius</text></g>
  </g>

  <text x="40" y="146" class="section">Core agents</text>
  <g transform="translate(40 160)">
    <g><rect class="card" width="280" height="120" rx="12"/><use href="#grid-24" x="12" y="12" width="96" height="96"/><use href="#icon-default" x="12" y="12" width="96" height="96" color="#f5f5f5"/><text x="126" y="52" class="label">Default</text><text x="126" y="72" class="meta">Base caret</text></g>
    <g transform="translate(300)"><rect class="card" width="280" height="120" rx="12"/><use href="#grid-24" x="12" y="12" width="96" height="96"/><use href="#icon-code" x="12" y="12" width="96" height="96" color="#49d3a3"/><text x="126" y="52" class="label">Code</text><text x="126" y="72" class="meta">Brackets + caret</text></g>
    <g transform="translate(600)"><rect class="card" width="280" height="120" rx="12"/><use href="#grid-24" x="12" y="12" width="96" height="96"/><use href="#icon-document" x="12" y="12" width="96" height="96" color="#f2bd45"/><text x="126" y="52" class="label">Document</text><text x="126" y="72" class="meta">Rounded page + caret</text></g>
  </g>
  <g transform="translate(40 296)">
    <g><rect class="card" width="280" height="120" rx="12"/><use href="#grid-24" x="12" y="12" width="96" height="96"/><use href="#icon-image" x="12" y="12" width="96" height="96" color="#ec68cf"/><text x="126" y="52" class="label">Image</text><text x="126" y="72" class="meta">Rounded frame + carets</text></g>
    <g transform="translate(300)"><rect class="card" width="280" height="120" rx="12"/><use href="#grid-24" x="12" y="12" width="96" height="96"/><use href="#icon-bird" x="12" y="12" width="96" height="96" color="#ad7cf5"/><text x="126" y="52" class="label">Bird</text><text x="126" y="72" class="meta">Mirrored caret wings</text></g>
    <g transform="translate(600)"><rect class="card" width="280" height="120" rx="12"/><use href="#grid-24" x="12" y="12" width="96" height="96"/><use href="#icon-browser" x="12" y="12" width="96" height="96" color="#72a7ff"/><text x="126" y="52" class="label">Browser</text><text x="126" y="72" class="meta">Split globe + Eigent lambda</text></g>
  </g>

  <text x="40" y="456" class="section">Abstract agents</text>
  <g transform="translate(40 472)">
    <g><rect class="card" width="160" height="144" rx="12"/><use href="#grid-24" x="32" y="10" width="96" height="96"/><use href="#icon-nested" x="32" y="10" width="96" height="96" color="#55d6bd"/><text x="80" y="128" class="label center">Nested</text></g>
    <g transform="translate(180)"><rect class="card" width="160" height="144" rx="12"/><use href="#grid-24" x="32" y="10" width="96" height="96"/><use href="#icon-mirrored" x="32" y="10" width="96" height="96" color="#9a8df4"/><text x="80" y="128" class="label center">Mirrored</text></g>
    <g transform="translate(360)"><rect class="card" width="160" height="144" rx="12"/><use href="#grid-24" x="32" y="10" width="96" height="96"/><use href="#icon-stacked" x="32" y="10" width="96" height="96" color="#e4c756"/><text x="80" y="128" class="label center">Stacked</text></g>
    <g transform="translate(540)"><rect class="card" width="160" height="144" rx="12"/><use href="#grid-24" x="32" y="10" width="96" height="96"/><use href="#icon-offset" x="32" y="10" width="96" height="96" color="#ee8f6c"/><text x="80" y="128" class="label center">Offset</text></g>
    <g transform="translate(720)"><rect class="card" width="160" height="144" rx="12"/><use href="#grid-24" x="32" y="10" width="96" height="96"/><use href="#icon-aperture" x="32" y="10" width="96" height="96" color="#65bbed"/><text x="80" y="128" class="label center">Aperture</text></g>
  </g>
  <g transform="translate(40 632)">
    <g><rect class="card" width="160" height="144" rx="12"/><use href="#grid-24" x="32" y="10" width="96" height="96"/><use href="#icon-interlocked" x="32" y="10" width="96" height="96" color="#67d7ef"/><text x="80" y="128" class="label center">Interlocked</text></g>
    <g transform="translate(180)"><rect class="card" width="160" height="144" rx="12"/><use href="#grid-24" x="32" y="10" width="96" height="96"/><use href="#icon-crossed" x="32" y="10" width="96" height="96" color="#a9dc55"/><text x="80" y="128" class="label center">Crossed</text></g>
    <g transform="translate(360)"><rect class="card" width="160" height="144" rx="12"/><use href="#grid-24" x="32" y="10" width="96" height="96"/><use href="#icon-split" x="32" y="10" width="96" height="96" color="#f2a14a"/><text x="80" y="128" class="label center">Split</text></g>
    <g transform="translate(540)"><rect class="card" width="160" height="144" rx="12"/><use href="#grid-24" x="32" y="10" width="96" height="96"/><use href="#icon-wave" x="32" y="10" width="96" height="96" color="#f06d88"/><text x="80" y="128" class="label center">Wave</text></g>
    <g transform="translate(720)"><rect class="card" width="160" height="144" rx="12"/><use href="#grid-24" x="32" y="10" width="96" height="96"/><use href="#icon-woven" x="32" y="10" width="96" height="96" color="#c4cad4"/><text x="80" y="128" class="label center">Woven</text></g>
  </g>

  <text x="40" y="817" class="meta">Dashed inset = 1px safe edge. Center axes and 1px coordinate cells are shown behind every icon.</text>
</svg>
